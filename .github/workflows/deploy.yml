name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_BUTTONDOWN_ENDPOINT: ${{ vars.PUBLIC_BUTTONDOWN_ENDPOINT }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_LS_DAMASCUS_CHECKOUT_URL: ${{ vars.PUBLIC_LS_DAMASCUS_CHECKOUT_URL }}
          PUBLIC_DAMASCUS_PRICE_USD: ${{ vars.PUBLIC_DAMASCUS_PRICE_USD || '25' }}
          PUBLIC_RELEASES_MANIFEST_URL: ${{ vars.PUBLIC_RELEASES_MANIFEST_URL || 'https://releases.qsoforge.com/damascus/latest.json' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=qso-marketing --branch=${{ github.ref_name }}
